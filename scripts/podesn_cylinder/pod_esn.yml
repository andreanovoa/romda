# Real-time DA of the cylinder wake with a POD-ESN model -- consumed by
# scripts/podesn_cylinder/pod_esn.py. `data.N_train`/`data.N_val` snapshots feed the
# ROM training (the script converts to `t_train`/`t_val` with `rom.dt`); the rest
# are held out for assimilation.
name: cylinder_main

data:
  noise_type: gauss
  noise_level: 0.02
  smoothing: 0.01
  N_train: 40                   # training snapshots
  N_val: 20                     # validation snapshots

forecast:
  kind: pod_esn                 # data-driven ROM on snapshot data -- run by pod_esn.py, not the CLI

rom:
  # ------ POD arguments ------ #
  domain: [0, 12, -2.5, 2.5]
  N_modes: 4
  skip_sensor_placement: false
  qr_selection: true
  down_sample_measurement: [20, 10]
  # ------ ESN arguments ------ #
  t_test: 0.
  N_units: 40
  train_ESN: true
  N_wash: 5
  noise: 1.0e-4
  N_func_evals: 26
  rho_range: [0.2, 0.9]
  upsample: 2
  Nq: 2
  # ------ Model arguments ------ #
  dt: 0.01
  plot_case: false

truth:
  t_start: 0.5
  t_stop: 5.
  Nt_obs: 25                    # time steps between observations

da:
  method: EnSRKF
  std_obs: 0.01
  m: 50

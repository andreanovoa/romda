# Parametric ESN-DA: Lorenz-63 trained across rho = 24-38 (chaotic across the range),
# deployed on a fresh truth at an unseen rho with rho estimated online. The truth and
# forecast values mirror dev/ESN-DA/defaults.LORENZ63_PARAMETRIC exactly; the da and
# window blocks are the recipe of the first version of tutorial 43; the tutorial
# (tutorials/4_Real-time_DA_ROMs/43_DA_parameter_estimation.ipynb) now observes every 6 steps and varies Nt_obs.
name: lorenz63_parametric
truth:
  model: Lorenz63
  params:
    dt: 0.02          # truth constructor kwarg (also seeds the training trajectories)
  noise_level: 0.02   # the training segments and the fresh truth trajectory (tutorial 43); lorenz63.yml has 5%
forecast:
  kind: parametric_esn
  train:
    param: rho        # constructor kwarg swept across regimes
    est_name: mu      # its `Model` parameter name ('rho' is the ESN's own)
    label: '$\rho$'
    values: [24.0, 26.0, 28.0, 30.0, 32.0, 34.0, 36.0, 38.0]
    dt: 0.02
    t_train_lyap: 60
    t_val_lyap: 5
    t_test_lyap: 5
  esn:
    N_units: 300
    upsample: 2
    N_wash: 20
    N_folds: 32
    N_grid: 3
    N_func_evals: 30
    grid_midpoints: true      # initial grid off the boundary
    bho_noise: gaussian        # the validation score is noisy
    stability_steps: 1350     # 50 T_lambda closed loop per candidate: the stability gate
    rho_range: [0.4, 1.0]
    tikh_range: [1.0e-6, 1.0e-9, 1.0e-10, 1.0e-12]
    sigma_in_range: [-2, 0.477]
    noise: 0.0                # no added input noise: the training segments carry the 2% noise of truth.noise_level, and
                              # 0.01 on top changes no valid time (rho = 28 and 33.5, 20 windows each, p = 0.83)
    seed: 0
    Win_type: sparse_dense_bias   # every unit sees the input bias, as in lorenz63.yml
    # conventions of the networks of the paper, pinned: they are not the defaults of romda
    scale_bias_in: true             # sigma_in multiplies the input bias
    regularize_bias_out: true       # the Tikhonov factor acts on the output bias
    bias_in: 0.16
da:
  seed: 0
  n_measured: 3
  da_method: EnSRKF
  m: 64               # tutorial 43
  Nt_obs: 28          # tutorial 43: 0.5 Lyapunov times (of 55 steps each) between observations
  std_obs: 0.05       # tutorial 43
  inflation: 1.0       # tutorial 43 (the default of the estimator)
  inflation_guard: true       # lambda~ = 1 while the forecast variance at the sensors exceeds tr C_dd
  inflation_average: plain    # a running mean of lambda~, clipped to [1, inflation_max^2] at every analysis
  inflation_rate: 0.1         # its weight: about the last ten analyses
  inflation_max: 3.0          # sqrt(lambda) <= 3
  cdd_fraction: 0.2           # C_dd: 0.2 of the standard deviation of each observable (CDD_STD overrides it)
  adaptive_inflation: false   # true: the factor of Evensen (2009, Sect. 15.3) at each analysis,
                              # in place of inflation
  inflate_parameters: true    # false: the inflation acts on the state rows only
  rho_true: 33.5      # between two training values (tutorial 43); the study axes live in the run script
# tutorial 43: the first observation at 0.4 Lyapunov times, 30 Lyapunov times of assimilation
window_lyap: [0.4, 30.0, 4.0]

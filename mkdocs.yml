hooks:
  - hooks.py

site_name: "Nóvoa Lab · romda"
site_description: Real-time reduced-order modelling and bias-aware data assimilation
site_author: Andrea Nóvoa
site_url: https://andreanovoa.github.io/romda/

repo_url: https://github.com/andreanovoa/romda
repo_name: andreanovoa/romda

docs_dir: docs

theme:
  name: material
  icon:
    logo: material/waveform
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            extensions:
              - hooks.py:GoogleDocstrings
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            inherited_members: false
            filters: ["!^_", "^__call__$"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/figures.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Examples: experiments.md
  - Published research with this package:
    - ICCS 2025, POD-ESN of the cylinder wake: replications/iccs2025.md
    - CMAME 2023, regularized bias-aware EnKF: replications/cmame2023.md
  - Class hierarchy: class-hierarchy.md
  - API reference:
    - romda.models:
      - Overview: api/models.md
      - Physical models: api/models_physical.md
      - Data-driven models:
        - Overview: api/models_data_driven.md
        - Echo State Network model: api/models_data_driven_esn.md
        - POD-ESN model: api/models_data_driven_pod_esn.md
        - Linear model: api/models_data_driven_linear.md
        - Projectors and modal decompositions: api/models_data_driven_projectors.md
        - Convolutional autoencoders: api/convolutional_autoencoders.md
        - Latent reduced-order models: api/models_data_driven_latent_roms.md
    - romda.estimators:
      - Overview: api/estimators.md
      - Ensemble filters: api/filter_stochastic.md
      - Kalman filters: api/filter_deterministic.md
    - romda.bias_estimators: api/bias_estimators.md
    - romda.observations: api/observations.md
    - API overview: api/index.md
  - Tutorials:

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romda"
version = "4.1.0"
description = "Real-time reduced-order modelling and bias-aware data assimilation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}  
authors = [
    {name = "Andrea Nóvoa"},
    {name = "Lukas Campbell"},
]
maintainers = [
    {name = "Andrea Nóvoa", email = "a.novoa@imperial.ac.uk"},
]
keywords = ["data-assimilation", "bias-estimation", "real-time", "ensemble-kalman-filter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "dynamodels>=0.8,<1.0",
    "ntsa>=0.3,<1.0",  # time-series analysis (fun_PSD, autocorrelation, embedding); used by tutorials and tests
    "echostatenetwork[opt]>=0.6.0,<1.0", # [opt] = scikit-optimize for ESN hyperparameter search; 0.6.0: open_loop, forecast, closed_loop_step, state_positions of one reservoir
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pillow>=12.3.0",  # not imported; CVE floor for matplotlib's dependency (CVE-2026-54058 critical, CVE-2026-42308/42309/42310)
    "pyyaml>=6.0",
    "scipy>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176 (predictable /tmp handling)
    "ruff>=0.11.5",  # CVE-2025-4574 (crossbeam-channel double-free)
]
# torch autoencoders and the CAE-ESNs (CAE, CAE1D, MultiScaleCAE, CAE_ESN, CAE1D_ESN,
# MultiScaleCAE_ESN); POD, SPOD and the ESN do not need it.
torch = [
    "torch>=2.6.0",  # CVE-2025-32434 (critical RCE via torch.load)
]
notebooks = [
    "ipykernel>=6.30",
    "ipywidgets>=8.1",
    "jupyter>=1.1",
    "nbconvert>=7.17.0",  # CVE-2025-53000 (Windows arbitrary code execution)
]

[project.urls]
Homepage = "https://andreanovoa.github.io/romda/"
Repository = "https://github.com/andreanovoa/romda"
Issues = "https://github.com/andreanovoa/romda/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/esnda", "scripts/thermoacoustics/jfm2024", "scripts/thermoacoustics/cmame2023",
             "dev/esn_da/test_esn_da.py", "dev/cae_esn_kolmogorov/test_ablations.py"]   # private paths: absent, skipped
addopts = [
    "-v",
    "--strict-markers",
    "-m", "not slow",
]
markers = [
    "slow: trains a model for longer than a few seconds; run with pytest -m slow",
]

[tool.ruff]
line-length = 120


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N802", "N803", "N806", "N815",  # DA notation: M, Af, Cdd, Nq, ... (see Notation in CLAUDE.md)
    "N801",  # DA class names: ESN_bias, rBA_EnKF, ...
    "E741",  # l and I in the equations
]
[tool.ruff.lint.isort]
# romda stays third-party, as before the src/romda layout (no blank line before its imports)
known-third-party = ["romda"]
